name: Backend Check

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/backend-architecture-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-check.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'scripts/backend-architecture-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-check.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend checks
        run: npm run backend:check
