global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: raaheasy-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:15000

  - job_name: node-api
    static_configs:
      - targets:
          - 127.0.0.1:19100

  - job_name: node-event
    static_configs:
      - targets:
          - 172.31.72.30:9100

  - job_name: redis
    static_configs:
      - targets:
          - 172.31.72.30:9121

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - 127.0.0.1:9644
